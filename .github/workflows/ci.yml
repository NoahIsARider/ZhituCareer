name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov pyflakes

      - name: Lint (pyflakes)
        run: |
          pyflakes app.py stats.py career_model.py job_matching.py course_matching.py \
                  retrieval.py fallback_matcher.py data_store.py cache.py \
                  agent/*.py tests/*.py

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov=stats --cov=retrieval --cov=data_store --cov=cache \
                 --cov=fallback_matcher --cov=job_matching --cov=course_matching \
                 --cov=career_model --cov-report=term-missing
