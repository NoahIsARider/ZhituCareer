<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智途 Career+ · 管理后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --brand-500: #f97316;
            --brand-600: #ea580c;
            --brand-700: #c2410c;
            --accent-2: #f43f5e;
            --dark: #0f172a;
            --muted: #64748b;
            --bg-soft: #f8fafc;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg-soft);
            color: var(--dark);
        }

        .navbar {
            background: rgba(15, 23, 42, .92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,.06);
            padding: 12px 0;
        }
        .navbar-brand {
            font-weight: 800; color: #fff !important; font-size: 16px;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-logo {
            width: 32px; height: 32px; border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
        }
        .nav-logo i { color: #fff; font-size: 16px; }
        .navbar .nav-link { color: rgba(255,255,255,.72) !important; font-size: 13.5px; }
        .navbar .nav-link:hover { color: #fff !important; }

        .page-title { margin: 26px 0 20px; }
        .page-title h4 { font-weight: 800; }
        .page-title p { color: var(--muted); font-size: 13px; margin: 0; }

        /* Stat cards */
        .stat-card { border-radius: 16px; overflow: hidden; color: #fff; position: relative; }
        .stat-card .icon-box {
            width: 48px; height: 48px; border-radius: 12px;
            background: rgba(255,255,255,.18);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
        }
        .stat-card h3 { font-weight: 800; font-size: 28px; }
        .stat-card p { font-size: 13px; opacity: .85; margin: 0; }
        .stat-1 { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .stat-2 { background: linear-gradient(135deg, var(--brand-500), var(--accent-2)); }
        .stat-3 { background: linear-gradient(135deg, #0ea5e9, #6366f1); }

        .card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(15,23,42,.05);
        }
        .card-header-custom {
            display: flex; align-items: center; justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--border);
        }
        .card-header-custom h6 { font-weight: 700; margin: 0; }
        .btn-primary {
            background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
            border: none; border-radius: 10px;
            font-weight: 600; font-size: 13.5px;
            transition: all .2s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--brand-600), var(--brand-700));
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(249,115,22,.3);
        }
        .btn-outline-primary {
            color: var(--brand-600); border-color: var(--brand-500);
            border-radius: 8px; font-size: 13px;
        }
        .btn-outline-primary:hover { background: var(--brand-500); border-color: var(--brand-500); color: #fff; }
        .btn-danger {
            background: #fee2e2; color: #b91c1c;
            border: none; border-radius: 8px; font-size: 13px;
        }
        .btn-danger:hover { background: #fecaca; color: #991b1b; }

        .badge { font-weight: 600; padding: 5px 10px; border-radius: 8px; font-size: 12px; }
        .badge.bg-soft-orange { background: rgba(249,115,22,.12); color: var(--brand-700); }
        .badge.bg-soft-blue { background: rgba(99,102,241,.12); color: #4f46e5; }
        .badge.bg-soft-green { background: rgba(16,185,129,.12); color: #059669; }
        .badge.bg-soft-gray { background: #f1f5f9; color: #475569; }

        .item-card { transition: transform .2s, box-shadow .2s; }
        .item-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(15,23,42,.09); }
        .item-card .meta { font-size: 12.5px; color: var(--muted); }
        .item-card .desc {
            font-size: 13px; color: #475569;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .skill-chip {
            display: inline-block;
            padding: 2px 9px;
            margin: 2px 4px 2px 0;
            border-radius: 6px;
            background: #f1f5f9;
            color: #475569;
            font-size: 11.5px;
        }
        .card-footer-custom {
            background: transparent;
            border-top: 1px solid var(--border);
            padding: 12px 20px;
            display: flex; gap: 8px;
        }

        .modal-content { border: none; border-radius: 18px; overflow: hidden; }
        .modal-header {
            background: linear-gradient(135deg, var(--brand-500), var(--accent-2));
            color: #fff; border: none;
        }
        .modal-header .btn-close { filter: invert(1); }
        .modal-body { padding: 24px; }
        .modal-footer { border-top: 1px solid var(--border); }
        .form-label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 13px;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand-500);
            box-shadow: 0 0 0 4px rgba(249,115,22,.14);
        }
        .empty-state { padding: 40px 20px; text-align: center; color: var(--muted); font-size: 13px; }
        .empty-state i { font-size: 34px; display: block; margin-bottom: 8px; opacity: .5; }
        .toast-container { z-index: 2000; }
        .toast-success { background: #ecfdf5; color: #065f46; }
        .toast-error { background: #fef2f2; color: #991b1b; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/admin">
                <span class="nav-logo"><i class="bi bi-compass"></i></span>
                智途 Career+ · 管理后台
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="nav-link" href="/"><i class="bi bi-house-door me-1"></i>前台首页</a>
                <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>退出登录</a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="page-title">
            <h4><i class="bi bi-speedometer2 me-2" style="color:var(--brand-500)"></i>后台管理中心</h4>
            <p>在这里管理智途 Career+ 平台的课程与职位数据</p>
        </div>

        <!-- 统计卡片 -->
        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="stat-card stat-1 p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h3 id="statCourses" class="mb-1">0</h3>
                            <p>课程数量</p>
                        </div>
                        <div class="icon-box"><i class="bi bi-book"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card stat-2 p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h3 id="statJobs" class="mb-1">0</h3>
                            <p>职位数量</p>
                        </div>
                        <div class="icon-box"><i class="bi bi-briefcase"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card stat-3 p-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h3 id="statTotal" class="mb-1">0</h3>
                            <p>数据总量</p>
                        </div>
                        <div class="icon-box"><i class="bi bi-database"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 课程管理 -->
        <div class="card mb-4" id="courses-section">
            <div class="card-header-custom">
                <h6><i class="bi bi-book me-2" style="color:var(--brand-500)"></i>课程管理</h6>
                <div class="d-flex gap-2">
                    <div class="input-group input-group-sm" style="width:260px;">
                        <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="courseSearchInput"
                               placeholder="搜索课程名称 / 提供方…">
                        <button class="btn btn-outline-primary" type="button" onclick="doCourseSearch()">搜索</button>
                    </div>
                    <button class="btn btn-primary" onclick="showCourseModal()">
                        <i class="bi bi-plus-lg me-1"></i>添加课程
                    </button>
                </div>
            </div>
            <div class="p-3">
                <div class="row g-3" id="courseList"></div>
                <div class="d-flex justify-content-center align-items-center gap-3 mt-3" id="coursePagination">
                    <button class="btn btn-outline-primary btn-sm" id="coursePrev" onclick="coursePageMove(-1)"><i class="bi bi-chevron-left"></i>上一页</button>
                    <span class="text-muted" id="coursePageInfo" style="font-size:13px;"></span>
                    <button class="btn btn-outline-primary btn-sm" id="courseNext" onclick="coursePageMove(1)">下一页<i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
        </div>

        <!-- 职位管理 -->
        <div class="card" id="jobs-section">
            <div class="card-header-custom">
                <h6><i class="bi bi-briefcase me-2" style="color:var(--brand-500)"></i>职位管理</h6>
                <div class="d-flex gap-2">
                    <div class="input-group input-group-sm" style="width:260px;">
                        <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                        <input type="text" class="form-control" id="jobSearchInput"
                               placeholder="搜索职位名称 / 公司 / 城市…">
                        <button class="btn btn-outline-primary" type="button" onclick="doJobSearch()">搜索</button>
                    </div>
                    <button class="btn btn-primary" onclick="showJobModal()">
                        <i class="bi bi-plus-lg me-1"></i>添加职位
                    </button>
                </div>
            </div>
            <div class="p-3">
                <div class="row g-3" id="jobList"></div>
                <div class="d-flex justify-content-center align-items-center gap-3 mt-3" id="jobPagination">
                    <button class="btn btn-outline-primary btn-sm" id="jobPrev" onclick="jobPageMove(-1)"><i class="bi bi-chevron-left"></i>上一页</button>
                    <span class="text-muted" id="jobPageInfo" style="font-size:13px;"></span>
                    <button class="btn btn-outline-primary btn-sm" id="jobNext" onclick="jobPageMove(1)">下一页<i class="bi bi-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 课程模态框 -->
    <div class="modal fade" id="courseModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="courseModalLabel">添加课程</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="courseForm">
                        <input type="hidden" id="courseIndex">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">课程名称</label>
                                <input type="text" class="form-control" id="courseTitle" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">级别</label>
                                <select class="form-select" id="courseLevel">
                                    <option value="Beginner">初级 Beginner</option>
                                    <option value="Intermediate">中级 Intermediate</option>
                                    <option value="Advanced">高级 Advanced</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">提供方</label>
                                <input type="text" class="form-control" id="courseProvider" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">时长</label>
                                <input type="text" class="form-control" id="courseDuration" placeholder="例如: 10 weeks">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">价格</label>
                            <input type="text" class="form-control" id="coursePrice" placeholder="例如: $599">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">课程描述</label>
                            <textarea class="form-control" id="courseDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">技能标签（逗号分隔）</label>
                            <input type="text" class="form-control" id="courseSkills" placeholder="例如: Python, Flask, Web开发">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">职业方向（逗号分隔）</label>
                            <input type="text" class="form-control" id="coursePaths" placeholder="例如: Web开发工程师, 后端开发工程师">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveCourseBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 职位模态框 -->
    <div class="modal fade" id="jobModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="jobModalLabel">添加职位</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="jobForm">
                        <input type="hidden" id="jobIndex">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">职位名称</label>
                                <input type="text" class="form-control" id="jobTitle" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">公司</label>
                                <input type="text" class="form-control" id="jobCompany" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">地点</label>
                                <input type="text" class="form-control" id="jobLocation" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">薪资范围</label>
                                <input type="text" class="form-control" id="jobSalary" placeholder="例如: 15k-25k">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">职位描述</label>
                            <textarea class="form-control" id="jobDescription" rows="3" required></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">任职要求（每行一条）</label>
                            <textarea class="form-control" id="jobRequirements" rows="3" placeholder="精通 Python&#10;熟悉 Flask"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="saveJobBtn">保存</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="toastBody"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let courseData = [];
        let jobData = [];
        let coursePage = 1, courseTotal = 0;
        let jobPage = 1, jobTotal = 0;
        const PAGE_SIZE = 50;
        let courseModal, jobModal;

        const toastEl = document.getElementById('toast');
        const toast = new bootstrap.Toast(toastEl, { delay: 3000 });

        function notify(message, ok = true) {
            toastEl.className = 'toast align-items-center border-0 ' + (ok ? 'toast-success' : 'toast-error');
            document.getElementById('toastBody').innerHTML =
                `<i class="bi ${ok ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'}"></i>${message}`;
            toast.show();
        }

        document.addEventListener('DOMContentLoaded', function () {
            courseModal = new bootstrap.Modal(document.getElementById('courseModal'));
            jobModal = new bootstrap.Modal(document.getElementById('jobModal'));
            document.getElementById('saveCourseBtn').addEventListener('click', saveCourse);
            document.getElementById('saveJobBtn').addEventListener('click', saveJob);
            document.getElementById('courseSearchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doCourseSearch(); });
            document.getElementById('jobSearchInput').addEventListener('keydown', e => { if (e.key === 'Enter') doJobSearch(); });
            loadCourseData();
            loadJobData();
        });

        function doCourseSearch() {
            coursePage = 1;
            loadCourseData();
        }

        function doJobSearch() {
            jobPage = 1;
            loadJobData();
        }

        function coursePageMove(delta) {
            const next = coursePage + delta;
            if (next < 1 || (next - 1) * PAGE_SIZE >= courseTotal) return;
            coursePage = next;
            loadCourseData();
        }

        function jobPageMove(delta) {
            const next = jobPage + delta;
            if (next < 1 || (next - 1) * PAGE_SIZE >= jobTotal) return;
            jobPage = next;
            loadJobData();
        }

        function updatePagination(kind) {
            const page = kind === 'course' ? coursePage : jobPage;
            const total = kind === 'course' ? courseTotal : jobTotal;
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            const info = `${page} / ${totalPages} 页（共 ${total} 条）`;
            const prevBtn = document.getElementById(kind + 'Prev');
            const nextBtn = document.getElementById(kind + 'Next');
            document.getElementById(kind + 'PageInfo').textContent = info;
            prevBtn.disabled = page <= 1;
            nextBtn.disabled = page >= totalPages;
        }

        function loadCourseData() {
            const search = document.getElementById('courseSearchInput').value.trim();
            const params = new URLSearchParams({ page: coursePage, page_size: PAGE_SIZE });
            if (search) params.set('search', search);
            fetch('/api/courses?' + params.toString())
                .then(r => r.json())
                .then(data => {
                    courseData = data.items || [];
                    courseTotal = data.total || 0;
                    renderCourseList();
                    updateStats();
                    updatePagination('course');
                })
                .catch(err => console.error('加载课程失败:', err));
        }

        function loadJobData() {
            const search = document.getElementById('jobSearchInput').value.trim();
            const params = new URLSearchParams({ page: jobPage, page_size: PAGE_SIZE });
            if (search) params.set('search', search);
            fetch('/api/jobs?' + params.toString())
                .then(r => r.json())
                .then(data => {
                    jobData = data.items || [];
                    jobTotal = data.total || 0;
                    renderJobList();
                    updateStats();
                    updatePagination('job');
                })
                .catch(err => console.error('加载职位失败:', err));
        }

        function updateStats() {
            document.getElementById('statCourses').textContent = courseTotal;
            document.getElementById('statJobs').textContent = jobTotal;
            document.getElementById('statTotal').textContent = courseTotal + jobTotal;
        }

        function renderCourseList() {
            const list = document.getElementById('courseList');
            if (!courseData.length) {
                list.innerHTML = '<div class="col-12"><div class="empty-state"><i class="bi bi-journal-x"></i>暂无课程数据，点击右上角「添加课程」开始</div></div>';
                return;
            }
            list.innerHTML = courseData.map(course => `
                <div class="col-xl-4 col-md-6">
                    <div class="card item-card h-100">
                        <div class="p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="fw-bold mb-0">${escapeHtml(course.title || '未命名课程')}</h6>
                                <span class="badge bg-soft-orange">${escapeHtml(course.level || '未知')}</span>
                            </div>
                            <div class="meta mb-2">
                                <i class="bi bi-mortarboard me-1"></i>${escapeHtml(course.provider || '未知提供方')}
                                <span class="mx-2">·</span>
                                <i class="bi bi-clock me-1"></i>${escapeHtml(course.duration || '未知')}
                                <span class="mx-2">·</span>
                                <i class="bi bi-tag me-1"></i>${escapeHtml(course.price || '未知')}
                            </div>
                            <p class="desc mb-2">${escapeHtml(course.description || '无描述')}</p>
                            <div>
                                ${(course.skills || []).map(s => `<span class="skill-chip">${escapeHtml(s)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="card-footer-custom">
                            <button class="btn btn-outline-primary btn-sm" onclick="showCourseModal('${escapeHtml(String(course.id))}')"><i class="bi bi-pencil me-1"></i>编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCourse('${escapeHtml(String(course.id))}')"><i class="bi bi-trash me-1"></i>删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderJobList() {
            const list = document.getElementById('jobList');
            if (!jobData.length) {
                list.innerHTML = '<div class="col-12"><div class="empty-state"><i class="bi bi-briefcase-x"></i>暂无职位数据，点击右上角「添加职位」开始</div></div>';
                return;
            }
            list.innerHTML = jobData.map(job => `
                <div class="col-xl-4 col-md-6">
                    <div class="card item-card h-100">
                        <div class="p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="fw-bold mb-0">${escapeHtml(job.title || '未命名职位')}</h6>
                                <span class="badge bg-soft-green">${escapeHtml(job.salary || '面议')}</span>
                            </div>
                            <div class="meta mb-2">
                                <span class="badge bg-soft-blue">${escapeHtml(job.company || '未知公司')}</span>
                                <span class="badge bg-soft-gray ms-1"><i class="bi bi-geo-alt me-1"></i>${escapeHtml(job.location || '未知地点')}</span>
                            </div>
                            <p class="desc mb-2">${escapeHtml(job.description || '无描述')}</p>
                            <div>
                                ${(job.requirements || []).slice(0, 4).map(r => `<span class="skill-chip">${escapeHtml(r)}</span>`).join('')}
                            </div>
                        </div>
                        <div class="card-footer-custom">
                            <button class="btn btn-outline-primary btn-sm" onclick="showJobModal('${escapeHtml(String(job.id))}')"><i class="bi bi-pencil me-1"></i>编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteJob('${escapeHtml(String(job.id))}')"><i class="bi bi-trash me-1"></i>删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function showCourseModal(id = null) {
            document.getElementById('courseForm').reset();
            document.getElementById('courseIndex').value = id || '';
            document.getElementById('courseModalLabel').textContent = id ? '编辑课程' : '添加课程';
            if (id) {
                const c = courseData.find(x => String(x.id) === String(id)) || {};
                document.getElementById('courseTitle').value = c.title || '';
                document.getElementById('courseDescription').value = c.description || '';
                document.getElementById('courseLevel').value = c.level || 'Beginner';
                document.getElementById('courseProvider').value = c.provider || '';
                document.getElementById('courseDuration').value = c.duration || '';
                document.getElementById('coursePrice').value = c.price || '';
                document.getElementById('courseSkills').value = (c.skills || []).join(', ');
                document.getElementById('coursePaths').value = (c.career_paths || []).join(', ');
            }
            courseModal.show();
        }

        function showJobModal(id = null) {
            document.getElementById('jobForm').reset();
            document.getElementById('jobIndex').value = id || '';
            document.getElementById('jobModalLabel').textContent = id ? '编辑职位' : '添加职位';
            if (id) {
                const j = jobData.find(x => String(x.id) === String(id)) || {};
                document.getElementById('jobTitle').value = j.title || '';
                document.getElementById('jobCompany').value = j.company || '';
                document.getElementById('jobLocation').value = j.location || '';
                document.getElementById('jobSalary').value = j.salary || '';
                document.getElementById('jobDescription').value = j.description || '';
                document.getElementById('jobRequirements').value = (j.requirements || []).join('\n');
            }
            jobModal.show();
        }

        function saveCourse() {
            const id = document.getElementById('courseIndex').value;
            const course = {
                title: document.getElementById('courseTitle').value,
                description: document.getElementById('courseDescription').value,
                level: document.getElementById('courseLevel').value,
                provider: document.getElementById('courseProvider').value,
                duration: document.getElementById('courseDuration').value,
                price: document.getElementById('coursePrice').value,
                skills: document.getElementById('courseSkills').value.split(',').map(s => s.trim()).filter(Boolean),
                career_paths: document.getElementById('coursePaths').value.split(',').map(s => s.trim()).filter(Boolean)
            };
            if (id) course.id = id;
            postJson('/api/courses/item', { course }).then(ok => {
                if (ok) { courseModal.hide(); loadCourseData(); notify('课程已保存'); }
            });
        }

        function saveJob() {
            const id = document.getElementById('jobIndex').value;
            const job = {
                title: document.getElementById('jobTitle').value,
                company: document.getElementById('jobCompany').value,
                location: document.getElementById('jobLocation').value,
                salary: document.getElementById('jobSalary').value,
                description: document.getElementById('jobDescription').value,
                requirements: document.getElementById('jobRequirements').value.split('\n').map(s => s.trim()).filter(Boolean)
            };
            if (id) job.id = id;
            postJson('/api/jobs/item', { job }).then(ok => {
                if (ok) { jobModal.hide(); loadJobData(); notify('职位已保存'); }
            });
        }

        async function postJson(url, body) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) return true;
                notify(data.error || '保存失败', false);
                return false;
            } catch (err) {
                notify('保存失败：' + err.message, false);
                return false;
            }
        }

        async function deleteItem(url, id) {
            try {
                const res = await fetch(url + '?id=' + encodeURIComponent(id), { method: 'DELETE' });
                const data = await res.json();
                if (data.success) return true;
                notify(data.error || '删除失败', false);
                return false;
            } catch (err) {
                notify('删除失败：' + err.message, false);
                return false;
            }
        }

        function deleteCourse(id) {
            if (!confirm('确定要删除这个课程吗？')) return;
            deleteItem('/api/courses/item', id).then(ok => {
                if (ok) { loadCourseData(); notify('课程已删除'); }
            });
        }

        function deleteJob(id) {
            if (!confirm('确定要删除这个职位吗？')) return;
            deleteItem('/api/jobs/item', id).then(ok => {
                if (ok) { loadJobData(); notify('职位已删除'); }
            });
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
    </script>
</body>
</html>
