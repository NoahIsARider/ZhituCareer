<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智途 Career+ · 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --brand-500: #f97316;
            --brand-600: #ea580c;
            --brand-700: #c2410c;
            --accent-1: #fb923c;
            --accent-2: #f43f5e;
            --dark: #0f172a;
            --muted: #64748b;
            --bg-soft: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 45%, #431407 100%);
            overflow: hidden;
            position: relative;
        }
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .5;
            animation: float 12s ease-in-out infinite;
        }
        .orb-1 { width: 420px; height: 420px; background: var(--brand-500); top: -120px; left: -100px; }
        .orb-2 { width: 360px; height: 360px; background: var(--accent-2); bottom: -140px; right: -80px; animation-delay: -4s; }
        .orb-3 { width: 220px; height: 220px; background: #6366f1; top: 40%; left: 55%; opacity: .35; animation-delay: -8s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        .login-wrap {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }
        .brand {
            text-align: center;
            margin-bottom: 28px;
        }
        .brand-logo {
            width: 64px; height: 64px;
            margin: 0 auto 14px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 32px rgba(249,115,22,.35);
        }
        .brand-logo i { font-size: 30px; color: #fff; }
        .brand h1 {
            color: #fff; font-size: 24px; font-weight: 700; letter-spacing: .5px;
        }
        .brand p { color: rgba(255,255,255,.6); font-size: 13px; margin-top: 6px; }

        .login-card {
            background: rgba(255,255,255,.08);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,.14);
            border-radius: 20px;
            padding: 32px 28px;
            box-shadow: 0 24px 60px rgba(0,0,0,.45);
        }
        .login-card .form-label {
            color: rgba(255,255,255,.82);
            font-size: 13px; font-weight: 600; margin-bottom: 8px;
        }
        .input-group-text {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.16);
            color: rgba(255,255,255,.65);
            border-right: 0;
        }
        .form-control {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.16);
            color: #fff;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 14px;
            transition: all .2s;
        }
        .form-control:focus {
            background: rgba(255,255,255,.12);
            border-color: var(--brand-500);
            box-shadow: 0 0 0 4px rgba(249,115,22,.18);
            color: #fff;
        }
        .form-control::placeholder { color: rgba(255,255,255,.35); }
        .btn-login {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-2));
            box-shadow: 0 10px 24px rgba(249,115,22,.35);
            transition: all .25s;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(249,115,22,.45); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: .7; transform: none; }

        .alert {
            border-radius: 10px;
            font-size: 13px;
            border: none;
        }
        .demo-hint {
            margin-top: 18px;
            padding: 12px 14px;
            border-radius: 12px;
            background: rgba(255,255,255,.06);
            border: 1px dashed rgba(255,255,255,.18);
            color: rgba(255,255,255,.55);
            font-size: 12.5px;
            line-height: 1.9;
        }
        .demo-hint b { color: rgba(255,255,255,.8); }
        .spinner {
            width: 18px; height: 18px;
            border: 2.5px solid rgba(255,255,255,.35);
            border-top-color: #fff;
            border-radius: 50%;
            display: inline-block;
            vertical-align: -3px;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="login-wrap">
        <div class="brand">
            <div class="brand-logo"><i class="bi bi-compass"></i></div>
            <h1>智途 Career+</h1>
            <p>AI 驱动的职业规划与求职智能助手</p>
        </div>

        <div class="login-card">
            <div id="errorBox" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" novalidate>
                <div class="mb-4">
                    <label for="phone" class="form-label">手机号码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-phone"></i></span>
                        <input type="tel" class="form-control" id="phone" name="phone"
                               placeholder="请输入手机号码" required pattern="[0-9]{11}">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required>
                    </div>
                </div>
                <button type="submit" class="btn-login" id="loginBtn">
                    <span id="btnText">登录</span>
                </button>
            </form>
            <div class="demo-hint">
                演示账号<br>
                <b>管理员</b> 13800000000 / admin123 &nbsp;·&nbsp; <b>普通用户</b> 13900000000 / user123
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('loginBtn');
        const btnText = document.getElementById('btnText');
        const errorBox = document.getElementById('errorBox');

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.classList.remove('d-none');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.add('d-none');

            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;
            if (!/^\d{11}$/.test(phone)) {
                showError('请输入 11 位有效手机号码');
                return;
            }
            if (!password) {
                showError('请输入密码');
                return;
            }

            btn.disabled = true;
            btnText.textContent = '登录中…';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    showError(data.message || '登录失败，请检查手机号码和密码');
                }
            } catch (err) {
                showError('网络异常，请稍后重试');
            } finally {
                btn.disabled = false;
                btnText.textContent = '登录';
            }
        });
    </script>
</body>
</html>
