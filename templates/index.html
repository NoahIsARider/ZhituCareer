<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智途 Career+ · 职业分析</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        :root {
            --brand-500: #f97316;
            --brand-600: #ea580c;
            --brand-700: #c2410c;
            --accent-2: #f43f5e;
            --dark: #0f172a;
            --muted: #64748b;
            --bg-soft: #f8fafc;
            --border: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg-soft);
            color: var(--dark);
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            background: rgba(15, 23, 42, .92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255,255,255,.06);
            padding: 12px 0;
        }
        .navbar-brand {
            font-weight: 800;
            color: #fff !important;
            font-size: 17px;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-logo {
            width: 34px; height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
        }
        .nav-logo i { color: #fff; font-size: 17px; }
        .navbar .nav-link { color: rgba(255,255,255,.72) !important; font-size: 14px; }
        .navbar .nav-link:hover { color: #fff !important; }
        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--brand-500), var(--accent-2));
            color: #fff;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 700;
        }

        /* Hero */
        .hero {
            position: relative;
            overflow: hidden;
            padding: 44px 0 52px;
            color: #fff;
            background: linear-gradient(160deg, #1e1b4b 0%, #0f172a 55%, #431407 100%);
        }
        .hero::after {
            content: '';
            position: absolute;
            width: 480px; height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(249,115,22,.28), transparent 65%);
            top: -160px; right: -80px;
            filter: blur(40px);
        }
        .hero h2 { font-weight: 800; font-size: 26px; }
        .hero p { color: rgba(255,255,255,.65); font-size: 14px; }
        .hero-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 5px 12px;
            border-radius: 999px;
            background: rgba(249,115,22,.16);
            border: 1px solid rgba(249,115,22,.35);
            color: #fdba74;
            font-size: 12px; font-weight: 600;
        }
        .hero-stats { display: flex; gap: 28px; margin-top: 22px; }
        .hero-stat b { font-size: 22px; font-weight: 800; display: block; }
        .hero-stat span { font-size: 12px; color: rgba(255,255,255,.55); }

        /* Cards */
        .card {
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 4px 16px rgba(15,23,42,.05);
            transition: transform .2s, box-shadow .2s;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(15,23,42,.09); }
        .card-header-custom {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 18px;
        }
        .card-header-custom .icon {
            width: 36px; height: 36px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 17px;
            color: var(--brand-600);
            background: rgba(249,115,22,.12);
        }
        .card-header-custom h5 { margin: 0; font-size: 16px; font-weight: 700; }

        /* Forms */
        .form-label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
        .form-control, .form-select {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 13px;
            font-size: 14px;
            transition: all .2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--brand-500);
            box-shadow: 0 0 0 4px rgba(249,115,22,.14);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
            border: none;
            border-radius: 10px;
            padding: 11px 20px;
            font-weight: 600;
            font-size: 14px;
            transition: all .2s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--brand-600), var(--brand-700));
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(249,115,22,.3);
        }
        .btn-outline-primary {
            color: var(--brand-600);
            border-color: var(--brand-500);
            border-radius: 10px;
            font-size: 14px;
        }
        .btn-outline-primary:hover { background: var(--brand-500); border-color: var(--brand-500); color: #fff; }

        .section-title {
            font-size: 18px; font-weight: 800;
            display: flex; align-items: center; gap: 10px;
            margin: 26px 0 16px;
        }
        .section-title .bar {
            width: 4px; height: 20px;
            border-radius: 4px;
            background: linear-gradient(var(--brand-500), var(--accent-2));
        }

        /* Analysis result cards */
        .analysis-content {
            font-size: 13.5px;
            color: #334155;
            line-height: 1.8;
            white-space: pre-wrap;
        }
        .result-card .tag {
            display: inline-block;
            padding: 3px 10px;
            margin: 3px 4px 3px 0;
            border-radius: 999px;
            background: rgba(249,115,22,.1);
            color: var(--brand-700);
            font-size: 12px;
            font-weight: 600;
        }
        .badge { font-weight: 600; padding: 6px 12px; border-radius: 8px; }
        .bg-gradient-brand { background: linear-gradient(135deg, var(--brand-500), var(--accent-2)); }

        /* Job card */
        .job-card .company { color: var(--muted); font-size: 13px; }
        .salary-badge {
            background: rgba(16,185,129,.12);
            color: #059669;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 8px;
        }
        .req-tag {
            display: inline-block;
            padding: 3px 10px;
            margin: 3px 5px 3px 0;
            border-radius: 6px;
            background: #f1f5f9;
            color: #475569;
            font-size: 12px;
        }
        .match-reason {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(249,115,22,.07);
            border-left: 3px solid var(--brand-500);
            font-size: 13px;
            color: #334155;
        }

        /* Course card */
        .course-card .level { font-size: 12px; font-weight: 600; }

        /* Spinner / loading */
        .loading-mask { padding: 30px; text-align: center; color: var(--muted); }
        .spinner-border { color: var(--brand-500) !important; }

        /* Toast */
        .toast-container { z-index: 1080; }
        .toast {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(15,23,42,.15);
        }
        .toast i { font-size: 18px; }
        .toast-success { background: #ecfdf5; color: #065f46; }
        .toast-error { background: #fef2f2; color: #991b1b; }

        .empty-state {
            padding: 34px 20px;
            text-align: center;
            color: var(--muted);
            font-size: 13.5px;
        }
        .empty-state i { font-size: 36px; display: block; margin-bottom: 10px; opacity: .5; }

        /* Data insight widgets */
        .chart-box { width: 100%; height: 280px; }
        .stat-mini { text-align: center; padding: 18px 10px; }
        .stat-mini b { display: block; font-size: 26px; font-weight: 800; }
        .stat-mini span { font-size: 12px; color: var(--muted); }
        .market-trends {
            font-size: 13.5px;
            color: #334155;
            line-height: 1.9;
            white-space: pre-wrap;
            max-height: 280px;
            overflow-y: auto;
        }

        /* Analysis history */
        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all .2s;
        }
        .history-item:hover { border-color: var(--brand-500); background: rgba(249,115,22,.05); }
        .history-item .h-meta { font-size: 12px; color: var(--muted); }
        .history-item .h-title { font-size: 13.5px; font-weight: 600; }
        .history-item .btn-icon {
            border: none; background: transparent; color: var(--muted);
            padding: 4px 8px; border-radius: 8px; font-size: 14px;
        }
        .history-item .btn-icon:hover { color: var(--accent-2); background: #fef2f2; }

        @media (max-width: 768px) {
            .hero { padding: 30px 0 34px; }
            .hero-stats { gap: 18px; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="nav-logo"><i class="bi bi-compass"></i></span>
                智途 Career+
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="d-none d-md-inline-flex align-items-center gap-2 text-white-50" style="font-size:13px;">
                    <span class="avatar" id="navAvatar">U</span>
                    <span id="navUserName">用户</span>
                </span>
                <a class="nav-link" href="/logout"><i class="bi bi-box-arrow-right me-1"></i>退出登录</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section class="hero">
        <div class="container position-relative">
            <span class="hero-chip"><i class="bi bi-stars"></i> AI 驱动 · 多 Agent 协作</span>
            <h2 class="mt-3">你好，欢迎使用智途 Career+</h2>
            <p>填写你的专业信息，AI 将为你生成专属的职业规划、求职建议与学习路径</p>
            <div class="hero-stats">
                <div class="hero-stat"><b>4</b><span>智能 Agent</span></div>
                <div class="hero-stat"><b>3</b><span>核心服务</span></div>
                <div class="hero-stat"><b>∞</b><span>职业可能</span></div>
            </div>
        </div>
    </section>

    <div class="container pb-5">
        <!-- 个人信息分析 -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card p-4">
                    <div class="card-header-custom">
                        <span class="icon"><i class="bi bi-person-vcard"></i></span>
                        <h5>个人信息分析</h5>
                    </div>
                    <form id="careerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="education">教育背景</label>
                                <select id="education" name="education" class="form-select" required>
                                    <option value="高中">高中</option>
                                    <option value="专科">专科</option>
                                    <option value="本科" selected>本科</option>
                                    <option value="硕士">硕士</option>
                                    <option value="博士">博士</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="major">专业</label>
                                <input type="text" id="major" name="major" class="form-control"
                                       placeholder="例如：计算机科学与技术" required>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label" for="skills">技能特长</label>
                                <textarea id="skills" name="skills" class="form-control" rows="2"
                                          placeholder="例如：Python, 数据分析, 机器学习, 团队协作" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="experience">工作经验</label>
                                <textarea id="experience" name="experience" class="form-control" rows="2"
                                          placeholder="请描述你的工作经验" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="career_goals">职业目标</label>
                                <textarea id="career_goals" name="career_goals" class="form-control" rows="2"
                                          placeholder="例如：成为一名资深 AI 工程师" required></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-primary px-5" id="analyzeBtn">
                                    <i class="bi bi-magic me-2"></i>获取职业分析
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 就业市场数据洞察 -->
        <div class="section-title"><span class="bar"></span>就业市场数据洞察</div>
        <div class="row g-3 mb-2" id="statMiniCards"></div>
        <div class="row g-3">
            <div class="col-lg-4 col-md-6">
                <div class="card p-3">
                    <div class="card-header-custom mb-2">
                        <span class="icon"><i class="bi bi-currency-yen"></i></span>
                        <h5>职位薪资分布</h5>
                    </div>
                    <div id="salaryChart" class="chart-box"></div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card p-3">
                    <div class="card-header-custom mb-2">
                        <span class="icon"><i class="bi bi-geo-alt"></i></span>
                        <h5>热门职位城市</h5>
                    </div>
                    <div id="cityChart" class="chart-box"></div>
                </div>
            </div>
            <div class="col-lg-4 col-md-6">
                <div class="card p-3">
                    <div class="card-header-custom mb-2">
                        <span class="icon"><i class="bi bi-bar-chart"></i></span>
                        <h5>热门技能需求</h5>
                    </div>
                    <div id="skillChart" class="chart-box"></div>
                </div>
            </div>
            <div class="col-12">
                <div class="card p-4">
                    <div class="card-header-custom mb-2">
                        <span class="icon"><i class="bi bi-graph-up-arrow"></i></span>
                        <h5>行业趋势研判</h5>
                    </div>
                    <div id="marketTrends" class="market-trends text-muted">加载中…</div>
                </div>
            </div>
        </div>

        <!-- 历史分析记录 -->
        <div class="section-title"><span class="bar"></span>历史分析记录</div>
        <div class="card p-4" id="historyCard">
            <div class="empty-state"><i class="bi bi-journal-text"></i>暂无历史记录，完成一次职业分析后会自动保存</div>
        </div>

        <!-- 分析结果 -->
        <div id="analysisResult" class="d-none">
            <div class="section-title" id="analysisTitle"><span class="bar"></span>分析结果</div>
            <div class="row g-3" id="analysisGrid"></div>
        </div>

        <!-- 职位搜索 -->
        <div class="section-title"><span class="bar"></span>职位搜索</div>
        <div class="card p-4">
            <form id="searchForm" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="keyword">职位关键词</label>
                    <input type="text" id="keyword" class="form-control" placeholder="例如：AI 工程师">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="location">期望城市</label>
                    <input type="text" id="location" class="form-control" placeholder="例如：杭州">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search me-2"></i>搜索职位</button>
                </div>
            </form>
        </div>
        <div id="jobList" class="row g-3 mt-1"></div>

        <!-- 课程推荐 -->
        <div class="section-title"><span class="bar"></span>课程推荐</div>
        <div class="card p-4">
            <form id="courseSearchForm" class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label class="form-label" for="courseKeyword">课程关键词</label>
                    <input type="text" id="courseKeyword" class="form-control" placeholder="例如：机器学习 / Python">
                </div>
                <div class="col-md-4">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-book me-2"></i>推荐课程</button>
                </div>
            </form>
        </div>
        <div id="courseList" class="row g-3 mt-1"></div>
    </div>

    <div class="toast-container position-fixed top-0 end-0 p-3">
        <div id="toast" class="toast align-items-center border-0" role="alert">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2" id="toastBody"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toastEl = document.getElementById('toast');
        const toast = new bootstrap.Toast(toastEl, { delay: 3500 });

        function notify(message, ok = true) {
            toastEl.className = 'toast align-items-center border-0 ' + (ok ? 'toast-success' : 'toast-error');
            document.getElementById('toastBody').innerHTML =
                `<i class="bi ${ok ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'}"></i>${message}`;
            toast.show();
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // 加载用户信息
        fetch('/api/me').then(r => r.json()).then(data => {
            if (data.success) {
                const name = data.user.name || '用户';
                document.getElementById('navUserName').textContent = name;
                document.getElementById('navAvatar').textContent = name.charAt(0);
            }
        }).catch(() => {});

        // 职位分析
        document.getElementById('careerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const btn = document.getElementById('analyzeBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>分析中…';

            try {
                const res = await fetch('/analyze_profile', {
                    method: 'POST',
                    body: new FormData(this)
                });
                const data = await res.json();
                if (data.success) {
                    let analysis = data.analysis;
                    try { analysis = typeof analysis === 'string' ? JSON.parse(analysis) : analysis; }
                    catch (err) {}
                    window.careerAnalysis = data.analysis;
                    renderAnalysis(analysis);
                    document.getElementById('analysisResult').classList.remove('d-none');
                    document.getElementById('analysisResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    notify('职业分析完成！');
                    loadHistory();
                } else {
                    throw new Error(data.error || '分析过程中出现错误');
                }
            } catch (err) {
                console.error(err);
                notify('分析失败：' + (err.message || '未知错误'), false);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-magic me-2"></i>获取职业分析';
            }
        });

        function renderAnalysis(analysis) {
            const grid = document.getElementById('analysisGrid');
            if (!analysis || typeof analysis !== 'object') {
                grid.innerHTML = '<div class="col-12"><div class="card p-4"><pre class="mb-0">' + escapeHtml(String(analysis)) + '</pre></div></div>';
                return;
            }
            const sourceBadge = analysis.source === 'local'
                ? '<span class="badge bg-secondary ms-2" title="LLM 服务暂不可用，已使用本地引擎生成分析">离线模式</span>'
                : '';
            document.getElementById('analysisTitle').innerHTML =
                '<span class="bar"></span>分析结果' + sourceBadge;
            const blocks = [
                { icon: 'bi-signpost-split', title: '职业发展方向', key: 'career_path' },
                { icon: 'bi-lightbulb', title: '求职建议', key: 'job_advice' },
                { icon: 'bi-arrow-up-circle', title: '需要提升的能力', key: 'skills_to_improve' },
                { icon: 'bi-briefcase', title: '推荐职位', key: 'recommended_positions', list: true }
            ];
            grid.innerHTML = blocks.map((b, i) => {
                let content = '';
                if (b.list) {
                    const items = analysis[b.key] || [];
                    content = items.map(p => `<span class="tag"><i class="bi bi-briefcase-fill me-1"></i>${escapeHtml(p)}</span>`).join('');
                } else {
                    content = `<div class="analysis-content">${escapeHtml(analysis[b.key] || '暂无内容')}</div>`;
                }
                return `
                    <div class="col-md-6">
                        <div class="card p-4 h-100 result-card">
                            <div class="card-header-custom">
                                <span class="icon" style="background:${i === 0 ? 'rgba(99,102,241,.12);color:#4f46e5' : 'rgba(249,115,22,.12);color:#ea580c'}"><i class="bi ${b.icon}"></i></span>
                                <h5>${b.title}</h5>
                            </div>
                            ${content}
                        </div>
                    </div>`;
            }).join('');
        }

        // 职位搜索
        document.getElementById('searchForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const list = document.getElementById('jobList');
            list.innerHTML = '<div class="col-12"><div class="card p-4 loading-mask"><span class="spinner-border"></span><p class="mt-3 mb-0">正在为你匹配最合适的职位…</p></div></div>';
            try {
                const body = new URLSearchParams({
                    keyword: document.getElementById('keyword').value,
                    location: document.getElementById('location').value,
                    career_analysis: window.careerAnalysis || ''
                });
                const res = await fetch('/search_jobs', { method: 'POST', body });
                const data = await res.json();
                if (data && data.error) throw new Error(data.error);
                renderJobs(data);
            } catch (err) {
                list.innerHTML = '<div class="col-12"><div class="card p-4 empty-state"><i class="bi bi-cloud-slash"></i>职位搜索失败：' + escapeHtml(err.message) + '</div></div>';
            }
        });

        function renderJobs(jobs) {
            const list = document.getElementById('jobList');
            let arr = Array.isArray(jobs) ? jobs : [jobs];
            arr = arr.filter(j => j && !j.error);
            if (!arr.length) {
                list.innerHTML = '<div class="col-12"><div class="card p-4 empty-state"><i class="bi bi-inbox"></i>未找到匹配职位，换个关键词试试</div></div>';
                return;
            }
            list.innerHTML = arr.map(job => `
                <div class="col-lg-6">
                    <div class="card p-4 h-100">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h5 class="mb-1">${escapeHtml(job.title)}</h5>
                                <div class="company"><i class="bi bi-building me-1"></i>${escapeHtml(job.company)}</div>
                            </div>
                            <span class="salary-badge">${escapeHtml(job.salary || '面议')}</span>
                        </div>
                        <p class="mt-3 mb-2" style="font-size:13.5px;color:#475569;">
                            <i class="bi bi-geo-alt me-1" style="color:var(--brand-500)"></i>${escapeHtml(job.location)}
                        </p>
                        <p class="mb-2" style="font-size:13.5px;color:#475569;">${escapeHtml(job.description)}</p>
                        <div class="mb-2">
                            ${(job.requirements || []).map(r => `<span class="req-tag">${escapeHtml(r)}</span>`).join('')}
                        </div>
                        ${job.match_reason ? `<div class="match-reason"><i class="bi bi-hand-thumbs-up me-1"></i>${escapeHtml(job.match_reason)}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 课程推荐
        document.getElementById('courseSearchForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const list = document.getElementById('courseList');
            list.innerHTML = '<div class="col-12"><div class="card p-4 loading-mask"><span class="spinner-border"></span><p class="mt-3 mb-0">正在匹配学习路径…</p></div></div>';
            try {
                const body = new URLSearchParams({
                    keyword: document.getElementById('courseKeyword').value,
                    career_analysis: window.careerAnalysis || ''
                });
                const res = await fetch('/search_course', { method: 'POST', body });
                const data = await res.json();
                if (data && data.error) throw new Error(data.error);
                renderCourses(data);
            } catch (err) {
                list.innerHTML = '<div class="col-12"><div class="card p-4 empty-state"><i class="bi bi-cloud-slash"></i>课程推荐失败：' + escapeHtml(err.message) + '</div></div>';
            }
        });

        function renderCourses(courses) {
            const list = document.getElementById('courseList');
            const arr = Array.isArray(courses) ? courses : [];
            if (!arr.length) {
                list.innerHTML = '<div class="col-12"><div class="card p-4 empty-state"><i class="bi bi-inbox"></i>未找到匹配课程</div></div>';
                return;
            }
            list.innerHTML = arr.map(course => `
                <div class="col-lg-4 col-md-6">
                    <div class="card p-4 h-100 course-card">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h6 class="mb-0 fw-bold">${escapeHtml(course.title)}</h6>
                            <span class="badge bg-gradient-brand level">${escapeHtml(course.level)}</span>
                        </div>
                        <div class="company mb-2"><i class="bi bi-mortarboard me-1"></i>${escapeHtml(course.provider)}</div>
                        <p class="mb-3" style="font-size:13px;color:#475569;">${escapeHtml(course.description)}</p>
                        <div class="d-flex gap-2 mb-3" style="font-size:12.5px;color:var(--muted);">
                            <span><i class="bi bi-clock me-1"></i>${escapeHtml(course.duration)}</span>
                            <span><i class="bi bi-tag me-1"></i>${escapeHtml(course.price)}</span>
                        </div>
                        <div class="mb-2">
                            ${(course.skills || []).map(s => `<span class="req-tag">${escapeHtml(s)}</span>`).join('')}
                        </div>
                        ${course.match_reason ? `<div class="match-reason"><i class="bi bi-hand-thumbs-up me-1"></i>${escapeHtml(course.match_reason)}</div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // ==================== 就业市场数据洞察 ====================
        function renderStatCards(stats) {
            const cities = new Set(stats.jobs.by_location.map(([c]) => c));
            const maxBucket = stats.jobs.salary_distribution.filter(([, n]) => n > 0).pop();
            const cards = [
                { icon: 'bi-briefcase', value: stats.jobs.total, label: '在招职位' },
                { icon: 'bi-mortarboard', value: stats.courses.total, label: '推荐课程' },
                { icon: 'bi-geo-alt', value: cities.size, label: '覆盖城市' },
                { icon: 'bi-currency-yen', value: maxBucket ? maxBucket[0] : '—', label: '高薪档位' }
            ];
            document.getElementById('statMiniCards').innerHTML = cards.map(c => `
                <div class="col-6 col-md-3">
                    <div class="card stat-mini">
                        <i class="bi ${c.icon} mb-1" style="color:var(--brand-500);font-size:20px;"></i>
                        <b>${escapeHtml(c.value)}</b><span>${c.label}</span>
                    </div>
                </div>`).join('');
        }

        function echartsUnavailable(el) {
            if (window.echarts) return false;
            el.innerHTML = '<div class="empty-state"><i class="bi bi-bar-chart"></i>图表库加载失败，请检查网络</div>';
            return true;
        }

        function renderCharts(stats) {
            const salaryEl = document.getElementById('salaryChart');
            const cityEl = document.getElementById('cityChart');
            const skillEl = document.getElementById('skillChart');
            if (echartsUnavailable(salaryEl)) return;

            const brandGradient = { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
                colorStops: [{ offset: 0, color: '#f97316' }, { offset: 1, color: '#ea580c' }] };

            const salary = stats.jobs.salary_distribution || [];
            echarts.init(salaryEl).setOption({
                grid: { left: 8, right: 8, top: 20, bottom: 8, containLabel: true },
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: salary.map(s => s[0]), axisLabel: { fontSize: 11 } },
                yAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } } },
                series: [{ type: 'bar', data: salary.map(s => s[1]), barWidth: '50%',
                    itemStyle: { borderRadius: [6, 6, 0, 0], color: brandGradient } }]
            });

            const cities = stats.jobs.by_location || [];
            echarts.init(cityEl).setOption({
                tooltip: { trigger: 'item' },
                legend: { bottom: 0, textStyle: { fontSize: 11 } },
                color: ['#f97316', '#f43f5e', '#6366f1', '#10b981', '#0ea5e9', '#f59e0b', '#8b5cf6', '#14b8a6'],
                series: [{ type: 'pie', radius: ['45%', '70%'], center: ['50%', '45%'],
                    data: cities.map(([name, value]) => ({ name, value })), label: { fontSize: 11 } }]
            });

            const skills = [...(stats.jobs.top_skills || [])].reverse();
            echarts.init(skillEl).setOption({
                grid: { left: 8, right: 8, top: 8, bottom: 8, containLabel: true },
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
                xAxis: { type: 'value', splitLine: { lineStyle: { color: '#f1f5f9' } } },
                yAxis: { type: 'category', data: skills.map(s => s[0]), axisLabel: { fontSize: 11 } },
                series: [{ type: 'bar', data: skills.map(s => s[1]), barWidth: '55%',
                    itemStyle: { borderRadius: [0, 6, 6, 0], color: '#6366f1' } }]
            });
        }

        function loadStats() {
            fetch('/api/stats/overview').then(r => r.json()).then(stats => {
                if (stats.error) return;
                renderStatCards(stats);
                renderCharts(stats);
                document.getElementById('marketTrends').textContent =
                    (stats.market && stats.market.industry_trends) || '暂无行业数据';
            }).catch(() => {});
        }

        // ==================== 历史分析记录 ====================
        function fmtTime(ts) {
            const d = new Date(ts * 1000);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        function renderHistory(items) {
            const card = document.getElementById('historyCard');
            if (!items.length) {
                card.innerHTML = '<div class="empty-state"><i class="bi bi-journal-text"></i>暂无历史记录，完成一次职业分析后会自动保存</div>';
                return;
            }
            card.innerHTML = items.map(item => {
                const a = item.analysis || {};
                const title = a.career_path ? String(a.career_path).slice(0, 42) : '职业分析';
                const p = item.profile || {};
                return `
                    <div class="history-item" data-id="${escapeHtml(item.id)}">
                        <div class="flex-grow-1">
                            <div class="h-title">${escapeHtml(title)}</div>
                            <div class="h-meta mt-1">${fmtTime(item.ts)} · ${escapeHtml(p.education || '')} · ${escapeHtml(p.major || '')}</div>
                        </div>
                        <div class="d-flex align-items-center gap-1">
                            <button class="btn btn-sm btn-outline-primary view-history">查看</button>
                            <button class="btn-icon delete-history" title="删除"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>`;
            }).join('');

            card.querySelectorAll('.view-history').forEach(btn => {
                btn.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    const id = btn.closest('.history-item').dataset.id;
                    const item = items.find(i => String(i.id) === id);
                    if (!item) return;
                    const form = document.getElementById('careerForm');
                    const p = item.profile || {};
                    form.education.value = p.education || '';
                    form.major.value = p.major || '';
                    form.skills.value = p.skills || '';
                    form.experience.value = p.experience || '';
                    form.career_goals.value = p.career_goals || '';
                    window.careerAnalysis = item.analysis;
                    renderAnalysis(item.analysis);
                    document.getElementById('analysisResult').classList.remove('d-none');
                    document.getElementById('analysisResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
                });
            });

            card.querySelectorAll('.delete-history').forEach(btn => {
                btn.addEventListener('click', async (ev) => {
                    ev.stopPropagation();
                    const id = btn.closest('.history-item').dataset.id;
                    if (!confirm('确定删除这条分析记录？')) return;
                    try {
                        await fetch('/api/history/' + encodeURIComponent(id), { method: 'DELETE' });
                        loadHistory();
                    } catch (e) { notify('删除失败', false); }
                });
            });
        }

        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const data = await res.json();
                if (data.success) renderHistory(data.items || []);
            } catch (e) { /* ignore */ }
        }

        loadStats();
        loadHistory();
    </script>
</body>
</html>
